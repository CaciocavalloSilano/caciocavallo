name: Release to Maven Central

on:
  push:
    tags:
      - 'cacio-*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Debug GPG state
        run: |
          echo "Secret keys:"
          gpg --list-secret-keys || echo "  (none)"
          echo "Public keys:"
          gpg --list-keys || echo "  (none)"
          echo "GPG_PRIVATE_KEY length:"
          echo -n "${GPG_PRIVATE_KEY}" | wc -c
          echo "GPG_PRIVATE_KEY first line:"
          echo "${GPG_PRIVATE_KEY}" | head -1
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish
        run: mvn -B -DskipTests -DperformRelease=true deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
